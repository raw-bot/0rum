asset: "BTC/USDT"
asset_mutable: true
starting_balance_usd: 10000.0

# PAPER FORWARD-TEST: drive entries from the AK MACD TradingView emitter.
# Native RSI DSL is suspended while signal_source = tradingview_external; the
# worker becomes a pure risk supervisor over what the external orchestrator opens.
signal_source: tradingview_external
allow_short: false                # 2026-07-01: switched to 4h long-only. Rigorous OOS validation
                                   # (next-bar-open execution, outlier-drop check, parameter sweep,
                                   # cross-asset check on ETH/SOL/BNB/LINK) found shorts have NO
                                   # robust edge on BTC/ETH 4h AK MACD (PF well below 1, OOS-negative)
                                   # while longs hold up OOS (PF ~1.5-2.0, stable across parameters,
                                   # survives dropping the top 5 winning trades). validate.py already
                                   # rejects any SELL_CANDIDATE with a clear reason when this is false.

# External-signal allowlist. ONE active strategy on purpose: the engine has no
# per-strategy "A opens / A closes" ownership yet. symbol must match
# syminfo.ticker EXACTLY. Chart is BINANCE:BTCUSDT -> "BTCUSDT" so signal,
# bracket AND the worker's exit monitoring all price off the SAME venue
# (Binance). Previously COINBASE:BTCUSD -> bracket levels were Coinbase but
# exits were checked on the Binance feed (~25-60pt basis gap), which silently
# stole take-profits and tripped stops early. Keep all three on one venue.
allowed_external_sources: ["tradingview", "local"]
allowed_external_strategies:
  - id: "ak_macd_15m_v1"
    symbol: "BTCUSDT"           # TradingView identity (syminfo.ticker), match exact
    engine_asset: "BTC/USDT"    # venue the worker prices/risk-manages on (Binance)
    timeframe: "4h"             # 2026-07-01: switched 15m->4h. Validated long-only edge
                                # (PF ~1.5-2.0 OOS on BTC and ETH; alts SOL/BNB/LINK rejected,
                                # in-sample-only, OOS-negative). Must match the Pine/producer
                                # payload timeframe (validate.py checks it).
    events: ["BUY_CANDIDATE", "EXIT"]   # SELL_CANDIDATE intentionally dropped: shorts have no
                                # validated edge (see allow_short note above). EXIT still allowed
                                # so an open long can always be closed.

# Performance targets are evaluation anchors, not risk mandates.
target_return_30d: 0.07
target_role: "ambitious"
acceptable_return_30d_min: 0.02
acceptable_return_30d_max: 0.03
success_return_30d: 0.05
excellent_return_30d: 0.07
overfit_suspicious_return_30d: 0.10

# Drawdown thresholds are expressed as positive magnitudes.
soft_drawdown: 0.03
max_drawdown: 0.05
emergency_stop_drawdown: 0.06
daily_loss_limit: 0.015

min_sharpe: 1.3
sharpe_status: "provisional_until_longer_multi_regime_sample"

# AK MACD paper forward-test sizes at 2% per trade (faithful to the source
# video backtest), so the risk band is raised to keep the guardrails coherent.
risk_per_trade_min: 0.005
risk_per_trade_max: 0.02

reflection_every: 10
cooldown_after_change_trades: 10
# Successor of one_variable_only: at most ONE DSL condition added, removed,
# or modified per structural mutation (diff on canonical entry+exit JSON).
one_block_only: true
allow_no_change: true
change_only_if_data_justifies: true
evidence_reflections_required: 2

threshold_actions:
  soft_drawdown:
    at: 0.03
    action: "reduce_risk_or_freeze_aggressive_new_positions"
  max_drawdown:
    at: 0.05
    action: "stop_strategy_and_enter_review_mode"
  emergency_stop:
    at: 0.06
    action: "neutralize_positions_and_require_manual_verification_before_restart"

failure_conditions:
  - "equity_drawdown_gte_0.05"
  - "daily_loss_gte_0.015"
  - "three_consecutive_negative_days_with_unfavorable_regime"
  - "hit_rate_or_expectancy_degrades_below_threshold"

0rum_policy:
  evaluate_every_closed_trades: 10
  max_variables_changed_per_cycle: 1
  change_required_each_cycle: false
  require_data_justification: true
  repeated_pattern_requires_reflections: 2
  preserve_working_strategy_when_evidence_is_weak: true
