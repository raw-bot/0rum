# Isolated paper-only short experiment. It is intentionally NOT attached to
# launchd; run scripts/run_paper_short_experiment.py manually for observations.
starting_balance_usd: 10000.0
candles_limit: 300
allowed_entry_sides: [short]
risk_sizing_basis: actual_stop
execution_mode: next_open
entry_drawdown_kill_pct: 0.05
max_total_stop_risk_pct: 0.005
max_symbol_stop_risk_pct: 0.005
max_open_positions_by_symbol:
  BTC/USDT: 1
max_symbol_notional_pct:
  BTC/USDT: 0.25
max_leverage: 1.0
reentry_policy: hold
merit_order:
  - btc_ak_macd_4h_short_experiment
shadow_regime_filters:
  BTC/USDT:
    timeframe: "4h"
    ema_period: 200
    enforce: false

strategies:
  - id: btc_ak_macd_4h_short_experiment
    engine: ak_macd
    symbol: BTC/USDT
    timeframe: "4h"
    risk_pct: 0.0025
    entry_enabled: true
    exit_policy: structural_bracket
    monitor_timeframe: "15m"
    reward_risk_ratio: 2.0
    params:
      allow_short: true
