# Multi-strategy paper portfolio — ONE shared account, all paper, no live, no
# TradingView. Runtime state/portfolio.yaml may override this committed fallback.
starting_balance_usd: 10000.0
candles_limit: 300
max_total_stop_risk_pct: 0.05
max_symbol_stop_risk_pct: 0.03
reentry_policy: topup
merit_order:
  - btc_utbot_m15_h1
  - btc_ak_macd_4h
min_topup_fraction: 0.0

forecast_gate:
  enabled: false   # 2026-07-17 : replay 2,5 ans = verrouillé 310/311, aucune influence sur les trades.
  history_limit: 900
  min_evaluations: 250
  neighbour_count: 80

strategies:
  - id: btc_ak_macd_4h
    engine: ak_macd
    symbol: BTC/USDT
    timeframe: "4h"
    risk_pct: 0.02
    entry_enabled: true
    exit_policy: structural_bracket
    monitor_timeframe: "15m"
    reward_risk_ratio: 2.0
    dynamic_exit:
      mode: execute
      version: ak_mfe_ssl_v1
      activation_r: 1.5
      giveback_r: 1.0
      floor_r: 0.25
      ema_len: 30
      atr_len: 14
      ssl_atr_mult: 1.0
      close_on_ssl_invalidation: true
      adaptive_target: true
      target_review_buffer_r: 0.5
      target_step_r: 1.0
      target_strength_min: 3
    params:
      allow_short: true      # paper-only: execute confirmed AK short candidates.

  - id: btc_utbot_m15_h1
    engine: utbot_mtf
    symbol: BTC/USDT
    timeframe: "15m"
    risk_pct: 0.005
    entry_enabled: true
    exit_policy: signal_or_stop
    monitor_timeframe: "15m"
    params:
      buy_key: 6.0
      buy_atr_period: 10
      sell_key: 7.0
      sell_atr_period: 20
      trend_ema_period: 200

  - id: btc_ema_cross
    engine: ema_cross
    symbol: BTC/USDT
    timeframe: "1h"
    risk_pct: 0.005
    entry_enabled: true
    exit_policy: signal_or_stop
    monitor_timeframe: "15m"
    dynamic_exit:
      mode: execute
      version: mfe_ratchet_v1
      activation_r: 1.0
      giveback_r: 1.5
      floor_r: 0.0
      close_on_ssl_invalidation: false
      adaptive_target: false
    params: &ema_cross_paper_params
      fast_period: 9
      slow_period: 21
      confirm_bars: 3
      adx_period: 14
      adx_threshold: 20.0
      swing_lookback: 8
      allow_short: true
      require_adx_rising: true
      slope_lookback: 3
      min_ema_gap_atr: 0.20
      min_slow_slope_atr: 0.05
      short_reward_risk: 2.0

  - id: eth_ema_cross
    engine: ema_cross
    symbol: ETH/USDT
    timeframe: "1h"
    risk_pct: 0.005
    entry_enabled: true
    exit_policy: signal_or_stop
    monitor_timeframe: "15m"
    dynamic_exit:
      mode: execute
      version: mfe_ratchet_v1
      activation_r: 1.0
      giveback_r: 1.5
      floor_r: 0.0
      close_on_ssl_invalidation: false
      adaptive_target: false
    params: *ema_cross_paper_params

  - id: btc_ha_trend_4h
    engine: ha_trend
    symbol: BTC/USDT
    timeframe: "4h"
    risk_pct: 0.01
    entry_enabled: true    # 2026-07-25 : activation paper explicite des cinq sleeves.
    exit_policy: structural_bracket
    monitor_timeframe: "15m"
    dynamic_exit:
      mode: execute
      version: mfe_ratchet_v1
      activation_r: 1.0
      giveback_r: 0.5
      floor_r: 0.1
      ema_len: 20
      adaptive_target: true
      target_review_buffer_r: 0.5
      target_step_r: 1.0
      target_strength_min: 3
    params:            # TradingView-validated defaults (backtests 2026-07-16)
      ema_len: 20
      slope_len: 5
      touch_window: 5
      swing_len: 10
      rr: 3.0
      rsi_len: 14

  - id: eth_donchian
    engine: donchian
    symbol: ETH/USDT
    timeframe: "1d"
    risk_pct: 0.02
    entry_enabled: true
    exit_policy: donchian_signal
    monitor_timeframe: "1h"
    params:
      entry_n: 20
      exit_n: 10

  - id: gold_cot
    engine: gold_cot
    symbol: PAXG/USDT
    timeframe: "1d"
    risk_pct: 0.02
    entry_enabled: true
    exit_policy: cot_signal
    monitor_timeframe: "1h"
    params: {}

  - id: nvda_opening_range
    engine: opening_range
    symbol: NVDA
    timeframe: "5m"
    risk_pct: 0.0025
    entry_enabled: true
    exit_policy: structural_bracket
    monitor_timeframe: "5m"
    params:
      min_range_atr_ratio: 0.25
